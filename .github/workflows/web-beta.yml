name: web-beta

on:
  push:
    branches: [beta]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-beta.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: beta-deploy
  cancel-in-progress: false

env:
  ZONE_ID: 1496328

jobs:
  build:
    runs-on: ubuntu-latest
    environment: beta
    defaults:
      run:
        working-directory: apps/web
    env:
      BACKEND_URL: https://api-beta.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install PWA dependencies
        run: pnpm --dir src-pwa install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build PWA
        run: pnpm build:pwa
      - name: List output files
        run: ls

      - name: Upload files to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: beta-btree-at
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
          BUNNY_S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
          BUNNY_STORAGE_ZONE: beta-btree-at
        run: bash scripts/upload-bunny.sh dist/pwa

      - name: Purge BunnyCDN
        uses: fjogeleit/http-request-action@v2
        with:
          url: 'https://api.bunny.net/pullzone/${{env.ZONE_ID}}/purgeCache'
          method: POST
          customHeaders: '{ "AccessKey": "${{ secrets.BUNNY_KEY }}"}'
