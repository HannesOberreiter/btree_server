name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.BTREE_SITES_DISPATCH_TOKEN }}

      - name: Enable auto-merge for release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.BTREE_SITES_DISPATCH_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if ! PR_NUMBER=$(jq -r '.number // empty' <<< "$PR_JSON") || [ -z "$PR_NUMBER" ]; then
            echo "Could not determine PR number from release-please output: $PR_JSON" >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash --auto

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docker-push.yml
    secrets: inherit
