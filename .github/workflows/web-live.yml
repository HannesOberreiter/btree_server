name: web-live

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  ZONE_ID: 1513251

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      BACKEND_URL: https://api.btree.at/api
      #BACKEND_URL_US: https://us.api.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install PWA dependencies
        run: pnpm --dir src-pwa install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build PWA
        run: pnpm build:pwa
      - name: List output files
        run: ls

      - name: Upload files to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: app-btree-at
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
          BUNNY_S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
          BUNNY_STORAGE_ZONE: app-btree-at
        run: bash scripts/upload-bunny.sh dist/pwa

      - name: Purge BunnyCDN
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.bunny.net/pullzone/${{env.ZONE_ID}}/purgeCache'
          method: POST
          customHeaders: '{ "AccessKey": "${{ secrets.BUNNY_KEY }}"}'
