name: live

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  ZONE_ID: 1513251

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://api.btree.at/api
      #BACKEND_URL_US: https://us.api.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID_LIVE }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_LIVE }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install PWA dependencies
        run: pnpm --dir src-pwa install --frozen-lockfile
      - name: Lint
        run: pnpm lint:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build PWA
        run: pnpm build:pwa
      - name: List output files
        run: ls

      - name: Upload Files to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: app-btree-at
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD_LIVE }}
          AWS_DEFAULT_REGION: de
          BUNNY_S3_ENDPOINT: https://de-s3.storage.bunnycdn.com
          BUNNY_STORAGE_ZONE: app-btree-at
        run: |
          set -euo pipefail
          test -s ./dist/pwa/index.html
          test -s ./dist/pwa/sw.js
          aws configure set default.s3.addressing_style path

          # Keep previous assets so open clients survive a deployment.
          aws s3 cp ./dist/pwa/assets "s3://${BUNNY_STORAGE_ZONE}/assets/" \
            --endpoint-url "${BUNNY_S3_ENDPOINT}" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp ./dist/pwa "s3://${BUNNY_STORAGE_ZONE}/" \
            --endpoint-url "${BUNNY_S3_ENDPOINT}" \
            --recursive \
            --exclude "assets/*" \
            --exclude "sw.js" \
            --exclude "index.html" \
            --cache-control "no-cache"

          # Publish entry points only after all referenced files exist.
          for file in sw.js index.html; do
            aws s3 cp "./dist/pwa/${file}" "s3://${BUNNY_STORAGE_ZONE}/${file}" \
              --endpoint-url "${BUNNY_S3_ENDPOINT}" \
              --cache-control "no-cache"
          done

      - name: Purge BunnyCDN
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.bunny.net/pullzone/${{env.ZONE_ID}}/purgeCache'
          method: POST
          customHeaders: '{ "AccessKey": "${{ secrets.BUNNY_KEY }}"}'
