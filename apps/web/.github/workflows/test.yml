name: test

on:
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://localhost:8101
      BACKEND_URL_US: http://localhost:8101
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}

    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ci_test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend packages
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint frontend
        run: pnpm lint:check

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Configure backend CI env
        run: |
          mkdir -p backend-env
          cat > backend-env/ci.env <<'EOF'
          NODE_ENV=ci
          PORT=8101
          URL=http://localhost:8101
          FRONTEND=http://localhost:9000
          AUTHORIZED=http://localhost:8001,http://localhost:9000
          JWT_SECRET=xfUBLsyAGk3jCLCDJ3Z7Dxf2jk8vzv2C3huGujKNbH
          JWT_EXPIRATION_MINUTES=10
          JWT_REFRESH_DAYS=7
          SESSION_SECRET=xfUBLsyAGk3jCLCDJ3Z7Dxf2jk8vzv2C3huGujKNbH
          OAUTH_CLIENT_ID=test-chatgpt-client
          OAUTH_CLIENT_SECRET=test-chatgpt-secret
          OAUTH_REDIRECT_URIS=https://chat.openai.com/aip/g-test/oauth/callback,https://chatgpt.com/aip/g-test/oauth/callback
          OAUTH_SCOPE=agent
          OAUTH_ACCESS_TOKEN_SECRET=test-oauth-access-token-secret
          OAUTH_ACCESS_TOKEN_EXPIRES_IN=3600
          OAUTH_REFRESH_TOKEN_DAYS=30
          DB_TYPE=mysql
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_NAME=ci_test
          DB_HOSTNAME=127.0.0.1
          DB_PORT=3306
          DB_POOL_MIN=0
          DB_POOL_MAX=10
          REDIS_PORT=6379
          REDIS_HOSTNAME=127.0.0.1
          REDIS_USERNAME=default
          REDIS_PASSWORD=
          MAIL_SMTP=smtp.ethereal.email
          MAIL_PORT=587
          MAIL_FROM=
          MAIL_PASSWORD=
          MAIL_SECURE=false
          MAIL_DKIM_SELECTOR=
          MAIL_DKIM_PRIVATE=false
          OPENWEATHER_KEY=
          DROPBOX_CLIENT_ID=
          DROPBOX_CLIENT_SECRET=
          LIMIT_HIVE=100
          LIMIT_APIARY=100
          LIMIT_SCALE=100
          TOTAL_LIMIT_HIVE=1000
          TOTAL_LIMIT_APIARY=100
          TOTAL_LIMIT_SCALE=10
          CRONJOB=0 0 1 1 *
          PAYPAL_CLIENT_ID=
          PAYPAL_APP_SECRET=
          STRIPE_SECRET_KEY=
          DISCOURSE_SSO=test_hannes
          FOXY_OFFICE_KEY=
          FOXY_OFFICE_URL=
          GOOGLE_CLIENT_ID=random_client_id
          GOOGLE_CLIENT_SECRET=random_client_secret
          APPLE_CLIENT_ID=
          APPLE_TEAM_ID=
          APPLE_KEY_ID=
          APPLE_PRIVATE_KEY=``
          OPEN_AI_KEY=random_open_ai_key
          OPEN_AI_DAILY_USER_TOKEN_LIMIT=0
          MOLLIE_API_KEY=random_mollie_api_key
          MISTRAL_API_KEY=random_mistral_api_key
          MISTRAL_MONTHLY_BUDGET_EUR=3
          IS_CHILD=true
          EOF

      - name: Migrate and seed backend database
        run: |
          docker run --rm --network host \
            -v "$PWD/backend-env:/home/node/app/env" \
            -e ENVIRONMENT=ci \
            -e IS_CHILD=true \
            --entrypoint /bin/sh \
            hannesoberreiter/btree_server:beta \
            -c "pnpm run prod:knex migrate:latest && pnpm run prod:knex seed:run"

      - name: Start backend
        run: |
          docker run -d --name btree-server-ci --network host \
            -v "$PWD/backend-env:/home/node/app/env" \
            -e ENVIRONMENT=ci \
            -e IS_CHILD=true \
            hannesoberreiter/btree_server:beta > backend.cid

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS -X POST http://localhost:8101/api/v1/auth/login \
              -H 'content-type: application/json' \
              -H 'origin: http://localhost:8001' \
              --data '{"email":"demo_en@btree.at","password":"demo_en"}' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs btree-server-ci
          exit 1

      - name: Start frontend
        run: |
          pnpm dev > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:9000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat frontend.log
          exit 1

      - name: Run Playwright E2E tests
        run: pnpm test:e2e:ci

      - name: Upload Playwright report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright/report
            test/playwright/test-results
            frontend.log
          if-no-files-found: ignore
