name: beta

on:
  push:
    branches: [beta]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ZONE_ID: 1496328
  STORAGE_NAME: btree-beta

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://api-beta.btree.at/api
      BACKEND_URL_US: https://us.api.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      BEEKEEPING_NEWS_BEARER: ${{ secrets.BEEKEEPING_NEWS_BEARER }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Build PWA
        run: npm run build:pwa
      - name: List output files
        run: ls

      - name: Deploy to BunnyCDN
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          source: './dist/pwa'
          destination: '/'
          storageZoneName: '${{ env.STORAGE_NAME }}'
          storagePassword: '${{ secrets.STORAGE_PASSWORD_BETA }}'
          accessKey: '${{ secrets.BUNNY_KEY }}'
          pullZoneId: '${{ env.ZONE_ID }}'
          remove: 'true'
          purgePullZone: 'true'
          upload: 'true'
