name: beta

on:
  push:
    branches: [beta]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  ZONE_ID: 1496328

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://api-beta.btree.at/api
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      OPENWEATHER_APP_ID: ${{ secrets.OPENWEATHER_APP_ID }}
      MATOMO_HOST: ${{ secrets.MATOMO_HOST }}
      MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      BEEKEEPING_NEWS_BEARER: ${{ secrets.BEEKEEPING_NEWS_BEARER }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Build PWA
        run: npm run build:pwa
      - name: List output files
        run: ls

      - name: Upload Files
        id: upload
        uses: Creepios/sftp-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localPath: './dist/pwa'
          remotePath: './btree-vue/beta'

      - name: Purge BunnyCDN
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.bunny.net/pullzone/${{env.ZONE_ID}}/purgeCache'
          method: 'POST'
          customHeaders: '{ "AccessKey": "${{ secrets.BUNNY_KEY }}"}'
