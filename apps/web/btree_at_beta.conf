# Expires map
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
}

server {
    if ($host = beta.btree.at) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    # Listen HTTP
    listen 80;
    listen [::]:80;
    server_name beta.btree.at;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;


}

server {
    server_name beta.btree.at;
    expires $expires;


    location /api {
        rewrite ^/(.*) https://api-beta.btree.at/$1 break;
    }

    location ~* \.(eot|otf|ttf|woff|woff2)$ {
        access_log      off;
        log_not_found   off;
        expires 1y;
        include             /etc/nginx/mime.types;
        add_header Access-Control-Allow-Origin *;
    }

    access_log	off;
	location = /robots.txt	{ access_log off; log_not_found off; }
	location = /favicon.ico	{ access_log off; log_not_found off; }
    location = /service-worker.js {
        expires off;
        add_header Cache-Control no-cache;
        access_log off;
    }
    location = /news.json {
        expires off;
        access_log off;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;

    root /var/www/btree-vue/beta;
    index index.html;
    error_page 404 /200.html;
    location / {
      try_files $uri $uri/ /index.html;
    }


    ssl_certificate /etc/letsencrypt/live/beta.btree.at/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beta.btree.at/privkey.pem; # managed by Certbot
}

