# Bunny CDN origin; see readme.md (Server Nginx). Include in nginx's http context.

map $http_x_btree_origin_key $btree_origin_authorized {
    default 0;
    include /etc/nginx/private/btree-origin-keys.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name origin-api.btree.at;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 403;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name origin-api.btree.at;

    ssl_certificate /etc/letsencrypt/live/origin-api.btree.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin-api.btree.at/privkey.pem;

    if ($btree_origin_authorized = 0) {
        return 403;
    }
    if ($http_x_btree_client_ip = "") {
        return 403;
    }

    # Fastify body limit.
    client_max_body_size 50m;

    location / {
        proxy_pass http://btree_at_api;
        proxy_http_version 1.1;
        proxy_set_header Host api.btree.at;
        proxy_set_header X-Forwarded-Host api.btree.at;
        proxy_set_header X-Forwarded-Server api.btree.at;
        proxy_set_header X-Forwarded-Proto https;

        # Set by Bunny; trusted only after the secret check.
        proxy_set_header X-Real-IP $http_x_btree_client_ip;
        proxy_set_header X-Forwarded-For $http_x_btree_client_ip;
        proxy_set_header Forwarded "";
        proxy_set_header X-Btree-Origin-Key "";
        proxy_set_header X-Btree-Client-IP "";

        # HTTP and SSE only; no WebSockets.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 60s;
        proxy_pass_request_headers on;
    }
}
